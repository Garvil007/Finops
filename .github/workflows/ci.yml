name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest

    # The suite runs on SQLite for speed and hermeticity. Postgres is here so the
    # dialect-specific paths -- the finops schema, date_trunc bucketing, Numeric
    # precision -- are exercised against the database this actually ships on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: finops
          POSTGRES_DB: finopsai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finops -d finopsai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://finops:finops@localhost:5432/finopsai
      FINOPSAI_TEST_POSTGRES_URL: postgresql+asyncpg://finops:finops@localhost:5432/finopsai

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migrations reverse cleanly
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # Never fail the build because a third-party upload was unavailable.
        continue-on-error: true
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: finopsai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm finopsai:ci python -c "import finopsai; print(finopsai.__version__)"
          docker run --rm finopsai:ci alembic --version
