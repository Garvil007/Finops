name: finopsai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # The entrypoint creates this one; the init script adds FINOPSAI_DB.
      POSTGRES_DB: litellm
      FINOPSAI_DB: finopsai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finopsai

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - finopsai

  litellm-proxy:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Prisma needs the synchronous driver and the in-network host.
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://finops:changeme@postgres:5432/litellm}
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://finops:changeme@postgres:5432/litellm}
      STORE_MODEL_IN_DB: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finopsai

  collectors:
    build: .
    restart: unless-stopped
    # Migrations run here for developer convenience so `docker compose up` gives
    # a working warehouse. In production apply them as a separate gated step.
    command: ["sh", "-c", "alembic upgrade head && python -m finopsai.collectors"]
    environment:
      ENV: ${ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/finopsai
      LITELLM_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/litellm
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: ${METRICS_PORT:-9100}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_INTERVAL_MINUTES: ${ALERT_INTERVAL_MINUTES:-15}
      GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}
    ports:
      - "${METRICS_PORT:-9100}:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm-proxy:
        condition: service_started
    networks:
      - finopsai

  api:
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn finopsai.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENV: ${ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/finopsai
      LITELLM_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/litellm
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8501}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finopsai

  # ---------------------------------------------------------------------------
  # Enabled in later phases.
  # ---------------------------------------------------------------------------
