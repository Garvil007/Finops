# Prometheus scrape configuration.
#
# Prometheus is the live view: request rates, collector health, budget
# utilisation, and how far behind each source is. It is not the accounting
# record -- counters reset on restart, so anything that has to reconcile to a
# dollar figure is read from Postgres instead.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: finopsai

scrape_configs:
  - job_name: finopsai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: finopsai-collectors
    metrics_path: /metrics
    static_configs:
      - targets: ["collectors:9100"]
        labels:
          service: collectors

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
